<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Bot Playtest</title>
<style>
  :root { --sq: min(10vw, 64px); }
  body { font-family: system-ui, sans-serif; background: #f4f1ea; color: #222; margin: 24px 16px; }
  h2 { margin: 0 0 14px; }
  #layout { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }

  /* Eval bar: white fills from the bottom, black from the top. */
  #evalbar { width: 22px; height: calc(var(--sq) * 8); background: #333; border: 2px solid #333;
             position: relative; overflow: hidden; }
  #evalwhite { position: absolute; bottom: 0; left: 0; right: 0; background: #fafafa;
               transition: height 0.4s ease; }

  #board { display: grid; grid-template-columns: repeat(8, var(--sq)); border: 2px solid #333; user-select: none; }
  .sq { width: var(--sq); height: var(--sq); display: flex; align-items: center; justify-content: center;
        font-size: calc(var(--sq) * 0.72); cursor: pointer; position: relative; }
  .light { background: #f0d9b5; }
  .dark  { background: #b58863; }
  .last     { background: #cdd26a !important; }
  .hint     { box-shadow: inset 0 0 0 4px #2b6cd4; }
  .selected { box-shadow: inset 0 0 0 4px #e8890c; }
  .target::after { content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%;
                   background: rgba(42, 157, 92, 0.6); }

  #panel { min-width: 220px; }
  #evaltext { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
  #status { min-height: 1.4em; color: #555; margin-bottom: 14px; }
  #suggestions { list-style: none; padding: 0; margin: 0 0 16px; }
  #suggestions li { padding: 7px 10px; margin-bottom: 6px; background: #fff; border: 1px solid #ddd;
                    border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  #suggestions li:first-child { border-color: #2b6cd4; }
  #suggestions li:hover { background: #eef3fc; }
  button { padding: 6px 12px; font-size: 14px; cursor: pointer; margin-right: 6px; }
</style>
</head>
<body>
<h2>Chess Bot Playtest</h2>
<div id="layout">
  <div id="evalbar"><div id="evalwhite" style="height: 50%"></div></div>
  <div id="board"></div>
  <div id="panel">
    <div id="evaltext">0.0</div>
    <div id="status"></div>
    <strong>Suggested moves</strong>
    <ul id="suggestions"></ul>
    <button onclick="newGame('white')">New game as white</button>
    <button onclick="newGame('black')">New game as black</button>
  </div>
</div>

<script>
const PIECES = { K:"♔", Q:"♕", R:"♖", B:"♗", N:"♘", P:"♙", k:"♚", q:"♛", r:"♜", b:"♝", n:"♞", p:"♟" };
let state = null, selected = null, thinking = false;

// FEN board part -> 64 [square name, piece] pairs, a8 first.
function squaresFromFen(fen) {
  const out = [];
  fen.split(" ")[0].split("/").forEach((row, r) => {
    let file = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { for (let i = 0; i < +ch; i++) out.push(["abcdefgh"[file++] + (8 - r), null]); }
      else out.push(["abcdefgh"[file++] + (8 - r), ch]);
    }
  });
  return out;
}

// Pawns as text: "+1.2", "-0.4", "0.0" (never "-0.0").
function pawns(p) {
  const r = Math.round(p * 10) / 10;
  return r === 0 ? "0.0" : (r > 0 ? "+" : "") + r.toFixed(1);
}

function render() {
  const el = document.getElementById("board");
  el.innerHTML = "";
  let squares = squaresFromFen(state.fen);
  if (state.player === "black") squares = squares.reverse();  // your pieces at the bottom

  const targets = selected ? state.legal.filter(m => m.startsWith(selected)).map(m => m.slice(2, 4)) : [];
  const hint = state.suggestions.length ? state.suggestions[0].uci : null;
  const last = state.last_move;

  squares.forEach(([name, piece], i) => {
    const sq = document.createElement("div");
    const file = "abcdefgh".indexOf(name[0]), rank = +name[1];
    sq.className = "sq " + ((file + rank) % 2 ? "light" : "dark");
    if (last && (last.slice(0, 2) === name || last.slice(2, 4) === name)) sq.classList.add("last");
    if (hint && !selected && (hint.slice(0, 2) === name || hint.slice(2, 4) === name)) sq.classList.add("hint");
    if (name === selected) sq.classList.add("selected");
    if (targets.includes(name)) sq.classList.add("target");
    sq.textContent = piece ? PIECES[piece] : "";
    sq.onclick = () => clickSquare(name);
    el.appendChild(sq);
  });

  // Eval bar + number (white's point of view; + = white better).
  document.getElementById("evalwhite").style.height = ((state.eval + 1) / 2 * 100) + "%";
  document.getElementById("evaltext").textContent =
    Math.abs(state.eval) > 0.995 ? (state.eval > 0 ? "White winning" : "Black winning") : pawns(state.eval_pawns);

  document.getElementById("status").textContent =
    state.result ? `Game over: ${state.result}` :
    thinking ? "Bot is thinking..." : "Your move";

  const list = document.getElementById("suggestions");
  list.innerHTML = "";
  state.suggestions.forEach(s => {
    const li = document.createElement("li");
    li.innerHTML = `<span><b>${s.san}</b></span><span>${pawns(s.eval_pawns)} · ${Math.round(s.share * 100)}%</span>`;
    li.onclick = () => !thinking && play(s.uci);
    list.appendChild(li);
  });
}

function clickSquare(name) {
  if (thinking || state.result) return;
  if (selected) {
    // Promotions always become a queen to keep things simple.
    const move = state.legal.find(m => m.startsWith(selected + name) && (m.length === 4 || m.endsWith("q")));
    if (move) return play(move);
  }
  selected = state.legal.some(m => m.startsWith(name)) ? name : null;
  render();
}

async function play(uci) {
  selected = null; thinking = true; state.last_move = uci; state.suggestions = []; render();
  const res = await fetch("/move", { method: "POST", body: JSON.stringify({ uci }) });
  if (res.ok) state = await res.json();
  thinking = false; render();
}

async function newGame(color) {
  thinking = true; selected = null; render();
  state = await (await fetch("/new", { method: "POST", body: JSON.stringify({ color }) })).json();
  thinking = false; render();
}

fetch("/state").then(r => r.json()).then(s => { state = s; render(); });
</script>
</body>
</html>
